<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Map — ArcGIS Maps SDK</title>
    <script type="module" src="https://js.arcgis.com/5.0/core.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: sans-serif;
      }

      arcgis-map {
        display: block;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <arcgis-map basemap="arcgis/topographic" center="-118.805, 34.027" zoom="13">
      <arcgis-zoom position="top-left"></arcgis-zoom>
      <arcgis-search position="top-right"></arcgis-search>
    </arcgis-map>
  </body>
</html>
